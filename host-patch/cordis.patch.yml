# Machine-local host patch: expose the two product subagent providers
# (Codex / Claude Code) so a preset can delegate to them. Live-reloaded:
# dsh web watches this file and re-applies it on save.
- insert:
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        # Route Claude Code through DeepSeek's Anthropic-compatible endpoint
        # using the same key the harness already stores (no Anthropic login).
        env:
          ANTHROPIC_AUTH_TOKEN: !!js globalThis.process.getBuiltinModule('node:fs').readFileSync(globalThis.process.env.HOME + '/.dsh/.credentials.yaml', 'utf8').match(/DEEPSEEK_API_KEY:\s*(\S+)/)?.[1] ?? ''
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          CLAUDE_CODE_EFFORT_LEVEL: max
